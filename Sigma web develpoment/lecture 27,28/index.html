<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position property</title>
    <style>
        /* most important point to remeber */
        /*  Expections : Transform , filter and perspective  properties can  also mmake an element appear as positioned 
        transform: translate(0);
            filter: invert(0);
            perspective: 0em; */

        .box {
            padding: 3px;
            margin: 6px;
            width: 80vw;
            height: 521px;
            border: 2px solid black;

        }

        * {
            margin: 0;
            padding: 0;
        }

        .box1 {
            position: sticky;
            margin: 0;
            padding: 0;
            top: 0px;
            width: 100%;
            height: 13vh;
            background-color: rgb(62, 206, 158);

        }

        .box2 {
            /* position: relative;
            top: 30px;
            left: 50px; */
            background-color: rgb(22, 97, 97);
        }

        .box3 {
            /* position: fixed; */
            background-color: brown;
            /* bottom: 0px; */
            /* left: 155px; */
        }

        .box4 {
            background-color: burlywood;
        }

        .box5 {
            background-color: purple;
        }


        .parent {
            margin: 34px;
            padding: 43px;
            border: 3px solid blue;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
    </div>
</body>

</html>
