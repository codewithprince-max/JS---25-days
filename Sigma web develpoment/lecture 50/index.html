<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters in CSS </title>
    <style>
/* img{
    filter: blur(10px);

} */
.img1{
filter: brightness(100%) contrast(1.2);
}
.img2{
filter: invert(2);
}
.img3{
filter: sepia(100%);
}
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://www.kidpid.com/wp-content/uploads/2018/04/pexels-photo-546819.jpeg" alt="">
        <img class="img2" src="https://qph.cf2.quoracdn.net/main-qimg-fc59021569ed1f0501a79ebf99f7d755-lq" alt="">
        <img class="img3" src="https://bookingagentinfo.com/wp-content/uploads/2022/04/Akshay-Kumar.png" alt="">
    </div>
</body>
</html>
