<!-- Without using br tag write  a vertically aligned forn asking for name,city and pincode of a user -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
   <header>
    <h2>
        Write a vertically aligned form asking for name, city, and pincode of a user
    </h2>
   </header>
    <form>
        <div ">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" style="background-color: blanchedalmond;" placeholder="Enter your name">
        </div>
        &nbsp;
        <div>
            <label for="city">City:</label>&nbsp; &nbsp;
            <input type="text" name="city" id="city" style="background-color: beige;" placeholder="Enter your city">

        </div>
        &nbsp;
        <div>
            <label for="pincode">Pincode:</label>
            <input type="text" id="pincode" name="pincode" style="background-color: rgb(27, 207, 156); " placeholder="Enter your pincode">
        </div>
        </div>

    </form>
</body>

</html>
