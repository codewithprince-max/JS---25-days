<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel</title>
</head>

<body>

    <form>
        <div>
            <h3>Passenger Contact info</h3>
            <input type="text" name="username" placeholder="First"> &nbsp;&nbsp;
            <input type="" name="" placeholder="Last">
        </div>
        <div>
            <h3>Address</h3>
            <input type="text" name="username" placeholder="Street Address">&nbsp;&nbsp;
            <input type="text" name="username" placeholder="Street Address line 2">
        </div>
        <br>
        <div>
            <input type="text" name="username" placeholder="City"> &nbsp;&nbsp;

        </div>
        <br>
        <div>

            <input type="text" name="username" placeholder="Postal/Zip code">&nbsp;&nbsp;


            <select name="  country select">
                <option value="">Select country</option> 1

                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="Indonesia">Indonesia</option>
            </select>
        </div>
        <br>
        <div>

            <input type="tel" name="username" placeholder="###  ### ###">
        </div>
        <div>
            <hr>
            <h2>
                Travel Information
            </h2>
            <hr>
            <h3>
                Destination
            </h3>
            <input type="text" name="Destination">
        </div>
        <div>
            <h3>
                <span> Departure Date</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>Return date</span>


            </h3>
            <input type="date" name="date" placeholder="MM/DD/YYYY"> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="date" name="date" placeholder="MM/DD/YYYY">
        </div>
        <div>
            <h3>
                Travel class
            </h3>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">Economy</label>
        </div>
        <div>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">Buisness</label>
        </div>
        <div>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">First</label>
        </div>
        <hr>
        <h2>
            Additional option
        </h2>
        <hr>
        <h3>
            Accommodation Needed
        </h3>
        <div>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">yes</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="checkbox">
            <label for="checkbox">No</label>
        </div>
        <h3>
            Airport Transfer Needed
        </h3>
        <div>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">yes</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="checkbox">
            <label for="checkbox">No</label>
        </div>
        <h3>
            Include Travel Insurance
        </h3>
        <div>
            <input type="checkbox" name="checkbox">
            <label for="checkbox">yes</label> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="checkbox">
            <label for="checkbox">No</label>
        </div>
        <h3>
            Special Instructions
        </h3>
        <div>
            <textarea name="text" rows="6" cols="90"></textarea>
        </div>
        <div>
            <input type="submit" value="Submit">

        </div>
    </form>
</body>

</html>
