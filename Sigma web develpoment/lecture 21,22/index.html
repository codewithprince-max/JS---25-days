<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>today learn sizing units in CSS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        div {
            box-sizing: border-box;
            border: 1px solid black;
            background-color: lightblue;
            width: 50vw;
            height: 8vh;

        }
    </style>
</head>

<body>
    <div >
      I am a box
        
    </div>

  
</body>

</html>
